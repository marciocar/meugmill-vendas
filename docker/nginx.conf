# Servidor estático do web component. Escuta em 8080 (nginx-unprivileged, sem root).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # Redirect relativo (Location: /demo/index.html). Absoluto, o nginx poria a porta interna 8080, que não existe
  # atrás de um proxy (achado no domínio da GMill).
  absolute_redirect off;

  # Componente: hosts de outros domínios precisam carregá-lo, então CORS aberto só aqui.
  location = /gmill-carteira.js {
    default_type application/javascript;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
  }

  # Proxy da API na mesma origem: a demo chama /api/* e não precisa de CORS nem de outra porta.
  # resolver + variável: o nginx sobe mesmo se a API ainda não estiver de pé e re-resolve o nome.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    # O CSV do E10 vai até 16 MB (o padrão do nginx é 1 MB); a API confere o limite de verdade.
    client_max_body_size 17m;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Token do IdP de TESTE na mesma origem, para a demo funcionar atrás de um domínio (ex.: a demonstração
  # da GMill). Só o endpoint de token; o mock monta o `iss` a partir do Host. Atrás de um proxy público, o
  # proxy é quem protege o acesso (o mock entrega token de admin a quem pedir).
  location = /default/token {
    resolver 127.0.0.11 valid=10s;
    set $idp_upstream http://idp:8080;
    proxy_pass $idp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Página de demonstração.
  location = / {
    return 302 /demo/index.html;
  }

  # Documentação: manual de uso e referência da API (Scalar), em /docs/.
  location = /docs {
    return 301 /docs/;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
