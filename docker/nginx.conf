# Servidor estático do web component. Escuta em 8080 (nginx-unprivileged, sem root).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Componente: hosts de outros domínios precisam carregá-lo, então CORS aberto só aqui.
  location = /gmill-carteira.js {
    default_type application/javascript;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
  }

  # Proxy da API na mesma origem: a demo chama /api/* e não precisa de CORS nem de outra porta.
  # resolver + variável: o nginx sobe mesmo se a API ainda não estiver de pé e re-resolve o nome.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Página de demonstração.
  location = / {
    return 302 /demo/index.html;
  }

  location / {
    try_files $uri =404;
  }
}
