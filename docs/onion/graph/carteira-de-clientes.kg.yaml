graph: carteira-de-clientes
title: "MeuGmill Vendas — carteira de clientes (domínio)"
layer: mixed
created: 2026-10-07
updated: 2026-10-07
owner: meugmill-vendas
purpose: |
  Primeiro domínio mapeado do MeuGmill Vendas: como a carteira de clientes é montada, como decide quais
  clientes entram, como distribui entre vendedores e como limita o que cada vendedor vê.
  FONTE ÚNICA: docs/business-context/02-product/features/carteira-de-clientes.md (texto do maestro, que
  declara ter sido conferido na interface e na API). Nada aqui foi conferido contra o código, que não está
  neste repo: por isso a confiança fica abaixo de 1 e os `trace:` apontam para o documento, não para código.
  Regra de escrita: não inventar regra além do documento. O que o documento não diz virou `question`.
como_usar: |
  Leia com: bash .claude/validation/kg-radar.sh docs/onion/graph/carteira-de-clientes.kg.yaml
  Quando o código chegar, re-verifique cada `rule`/`invariant`/`policy` contra ele e troque o `trace:`
  do documento pelo `arquivo:linha` do código.

