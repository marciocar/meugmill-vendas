    label: "DECISÃO: adotar o Onion neste repo (modo `greenfield`). O que se ganha não é o inventário de scripts — é o gate determinístico que REPROVA e o KG como fonte de estado. As duas metades se sustentam: gate sem grafo protege sintaxe sem memória; grafo sem gate é acervo que ninguém é obrigado a manter honesto."

