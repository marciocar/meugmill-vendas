    label: "RESPONDIDA em 2026-10-07: o domínio é o módulo MeuGmill Vendas, e o 1º tema mapeado é a carteira de clientes em docs/onion/graph/carteira-de-clientes.kg.yaml (o resto do módulo segue como Q_MODULE_SCOPE lá). A PERGUNTA QUE ABRE O HÁBITO, e o radar vai afundá-la a cada leitura até ela ser respondida: qual é o domínio deste repo — as entidades, os estados, as decisões já tomadas e as premissas que ainda são premissa? Responder é criar docs/onion/graph/<tema>.kg.yaml com nós reais e reconciliar esta pergunta para `done`. Enquanto ela estiver aberta, a próxima sessão que abrir este repo tem de reconstruir o entendimento da prosa — que é exatamente o custo que o KG existe para eliminar."

