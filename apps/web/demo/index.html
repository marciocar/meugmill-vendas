<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Demo do host - gmill-carteira</title>
    <style>
      /* CSS global agressivo do host: não deve afetar o shadow DOM. */
      button {
        background: red !important;
        color: yellow !important;
        border: 4px dashed black !important;
      }
      h1,
      p,
      ul,
      li {
        color: red !important;
        font-size: 30px !important;
      }
    </style>
  </head>
  <body>
    <h1>Sistema do host</h1>
    <label>
      Perfil do token de teste:
      <select id="profile">
        <optgroup label="Demonstração (filial DEMO-ES, ver scripts/demo)">
          <option value="demo-admin">admin (demo-admin)</option>
          <option value="demo-gestor">gestor (demo-gestor)</option>
          <option value="demo-vendedor">vendedor (demo-vend, Ana Martins)</option>
          <option value="demo-supervisao">supervisão (demo-sup)</option>
        </optgroup>
        <optgroup label="Testes do smoke (filial-01)">
          <option value="smoke-admin">admin (admin-01)</option>
          <option value="smoke-gestor">gestor (gest-01)</option>
          <option value="smoke-vendedor">vendedor (vend-01)</option>
          <option value="smoke-supervisao">supervisão (sup-01)</option>
          <option value="demo">sem client_id conhecido (vendedor-01)</option>
        </optgroup>
      </select>
    </label>
    <button id="get-token">Obter token de teste</button>
    <button id="clear-token">Limpar token</button>
    <p>
      <label>
        Colar token:
        <input id="manual-token" type="text" size="40" autocomplete="off" />
      </label>
      <button id="apply-token">Aplicar token</button>
    </p>

    <gmill-carteira debug api-base="/api"></gmill-carteira>

    <h2>Log</h2>
    <pre id="log"></pre>

    <script type="module">
      import '../src/element.tsx';
      // IdP de teste (mock-oauth2-server) da infra Docker.
      // O issuer dos tokens é http://localhost:39080/default: o navegador precisa pedir o token nesse endereço.
      // Local (túnel SSH ou a própria máquina): o IdP direto na porta dele. Num domínio (ex.: a demonstração
      // da GMill), o nginx da imagem repassa /default/token ao IdP na mesma origem.
      const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
      const IDP_TOKEN_URL = LOCAL ? 'http://localhost:39080/default/token' : '/default/token';
      const el = document.querySelector('gmill-carteira');
      const log = document.getElementById('log');
      const write = (msg) => {
        log.textContent += `[${new Date().toISOString()}] ${msg}\n`;
      };

      document.getElementById('get-token').addEventListener('click', async () => {
        try {
          const res = await fetch(IDP_TOKEN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'client_credentials',
              // O IdP de teste escolhe sub, perfis e filiais pelo client_id (docker/idp-config.json).
              client_id: document.getElementById('profile').value,
              client_secret: 'demo',
              scope: 'openid',
            }),
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const { access_token } = await res.json();
          el.token = access_token; // por propriedade: não vai para o DOM
          write(`token de teste (${document.getElementById('profile').value}) obtido e aplicado`);
        } catch (err) {
          write(`falha ao obter token de teste: ${err.message}`);
        }
      });
      document.getElementById('apply-token').addEventListener('click', () => {
        const input = document.getElementById('manual-token');
        el.token = input.value.trim() || null;
        input.value = '';
        write('token manual aplicado');
      });
      document.getElementById('clear-token').addEventListener('click', () => {
        el.token = null;
        write('token limpo');
      });
      document.addEventListener('token-expired', () => {
        write('token-expired recebido');
      });
    </script>
  </body>
</html>
